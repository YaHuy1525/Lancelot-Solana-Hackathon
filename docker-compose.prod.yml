version: '3.8'

services:
  backend-prod:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: lancelot-backend:production
    container_name: lancelot-backend-prod
    ports:
      - "5001:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=http://localhost:8080
    restart: always
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  frontend-prod:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: lancelot-frontend:production
    container_name: lancelot-frontend-prod
    ports:
      - "8080:80"
    depends_on:
      - backend-prod
    restart: always
