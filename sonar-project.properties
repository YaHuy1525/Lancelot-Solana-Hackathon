# SonarQube / SonarScanner Configuration File for Lancelot Solana App
sonar.projectKey=lancelot-solana-app
sonar.projectName=Lancelot Solana Hackathon App
sonar.projectVersion=1.0.0

# Path to sources
sonar.sources=backend/src,frontend/src

# Path to tests
sonar.tests=backend/src/test

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**

# Code Coverage Reports
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=js,ts
